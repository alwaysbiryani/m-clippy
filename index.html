<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Trace</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@300;400;500&family=Instrument+Serif:ital@0;1&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0a0a0b;--surface:#111113;--surface2:#17171a;--surface3:#202024;
  --text:#f4f4f5;--muted:#a1a1aa;--micro:#71717a;--border:#242428;
  --accent:#8b5cf6;--accent-dim:rgba(139,92,246,.14);--red:#ef4444;
  --font-sans:'DM Sans',system-ui,sans-serif;--font-mono:'DM Mono',ui-monospace,monospace;--font-serif:'Instrument Serif',Georgia,serif;
}
[data-theme="light"]{--bg:#fafafa;--surface:#fff;--surface2:#f4f4f5;--surface3:#e4e4e7;--text:#0a0a0b;--muted:#52525b;--micro:#71717a;--border:#e4e4e7;--accent-dim:rgba(139,92,246,.1)}
html,body{height:100%;overflow:hidden}
body{background:var(--bg);color:var(--text);font-family:var(--font-sans);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
::selection{background:var(--accent-dim)}
#app{height:100vh;display:grid;grid-template-columns:220px minmax(0,1fr);overflow:hidden}
.sidebar{border-right:1px solid var(--border);background:linear-gradient(180deg,var(--surface),var(--bg));display:flex;flex-direction:column;padding:22px 16px;gap:22px}
.logo{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
.logo strong{font-family:var(--font-serif);font-size:30px;font-weight:400;letter-spacing:.02em}
.logo span{font-family:var(--font-mono);font-size:10px;color:var(--micro);text-transform:uppercase;letter-spacing:.12em}
.nav{display:grid;gap:8px}
.nav button{width:100%;border:1px solid transparent;background:transparent;color:var(--muted);border-radius:10px;padding:10px 12px;text-align:left;transition:background .15s,border-color .15s,color .15s}
.nav button:hover,.nav button.active{background:var(--surface2);border-color:var(--border);color:var(--text)}
.nav small{float:right;color:var(--micro);font-family:var(--font-mono);font-size:11px}
.sidebar-note{margin-top:auto;color:var(--micro);font-family:var(--font-mono);font-size:11px;line-height:1.7}
.main{min-width:0;overflow:hidden;display:flex;flex-direction:column}
.screen{display:none;height:100%;overflow:auto;padding:34px clamp(22px,5vw,72px)}
.screen.active{display:block}
.home-shell{max-width:920px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;gap:18px}
.pinned-strip{min-height:70px;border:1px dashed var(--border);border-radius:18px;background:color-mix(in srgb,var(--surface) 70%,transparent);display:flex;align-items:center;padding:16px 18px;color:var(--micro)}
.pinned-strip strong{font-family:var(--font-mono);font-size:11px;text-transform:uppercase;letter-spacing:.12em;color:var(--muted);margin-right:12px}
.current-card{flex:1;min-height:520px;border:1px solid var(--border);border-radius:24px;background:var(--surface);box-shadow:0 24px 80px rgba(0,0,0,.18);display:flex;flex-direction:column;overflow:hidden}
.current-head{display:flex;align-items:center;justify-content:space-between;gap:14px;border-bottom:1px solid var(--border);padding:18px 20px}
.current-label{font-family:var(--font-mono);font-size:11px;color:var(--micro);text-transform:uppercase;letter-spacing:.13em}
#autosaveState{font-family:var(--font-mono);font-size:11px;color:var(--micro)}
.editor{display:flex;flex-direction:column;gap:0;flex:1}
#clipTitle{border:0;background:transparent;padding:26px 28px 10px;font-family:var(--font-serif);font-size:40px;line-height:1.1;color:var(--text);outline:0}
#clipTitle::placeholder{color:color-mix(in srgb,var(--muted) 58%,transparent)}
#clipContent{flex:1;min-height:360px;resize:none;border:0;background:transparent;padding:10px 28px 30px;outline:0;color:var(--text);font-size:17px;line-height:1.75}
#clipContent::placeholder{color:color-mix(in srgb,var(--muted) 64%,transparent)}
.home-actions{display:flex;justify-content:flex-end}
.primary-btn{border:1px solid var(--border);background:var(--text);color:var(--bg);border-radius:999px;padding:11px 18px;font-weight:500;transition:transform .12s,opacity .12s}
.primary-btn:hover{transform:translateY(-1px);opacity:.92}
.archive-shell{max-width:980px;margin:0 auto;display:grid;gap:22px}
.archive-head{display:flex;justify-content:space-between;align-items:end;gap:16px;border-bottom:1px solid var(--border);padding-bottom:18px}
h1{font-family:var(--font-serif);font-size:44px;font-weight:400;line-height:1}.muted{color:var(--micro)}
.clip-list{display:grid;gap:10px}.empty{border:1px solid var(--border);border-radius:18px;background:var(--surface);padding:28px;color:var(--micro)}
.clip-row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:16px;align-items:center;border:1px solid var(--border);border-radius:16px;background:var(--surface);padding:16px;transition:border-color .15s,background .15s}
.clip-row:hover{border-color:color-mix(in srgb,var(--accent) 38%,var(--border));background:var(--surface2)}
.clip-title{font-size:16px;font-weight:500;margin-bottom:4px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.clip-preview{color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:660px}.clip-date{font-family:var(--font-mono);font-size:11px;color:var(--micro);margin-top:8px}.row-actions{display:flex;gap:8px}.ghost-btn,.danger-btn{border:1px solid var(--border);background:transparent;border-radius:999px;padding:8px 12px;color:var(--muted)}.ghost-btn:hover{color:var(--text);background:var(--surface3)}.danger-btn:hover{color:#fff;background:var(--red);border-color:var(--red)}
@media(max-width:760px){#app{grid-template-columns:1fr}.sidebar{border-right:0;border-bottom:1px solid var(--border);padding:16px;gap:14px}.nav{grid-template-columns:1fr 1fr}.sidebar-note{display:none}.screen{padding:20px}.current-card{min-height:60vh}#clipTitle{font-size:32px}.archive-head{align-items:start;flex-direction:column}.clip-row{grid-template-columns:1fr}.row-actions{justify-content:flex-start}}
</style>
</head>
<body>
<div id="app">
  <aside class="sidebar" aria-label="Trace navigation">
    <div class="logo"><strong>Trace</strong><span>Sprint 0.5</span></div>
    <nav class="nav">
      <button id="homeNav" class="active" type="button">Home</button>
      <button id="archiveNav" type="button">All Clips <small id="clipCount">0</small></button>
    </nav>
    <div class="sidebar-note">Local-first.<br>Fresh current clip on every launch.<br>Autosaved while you type.</div>
  </aside>

  <main class="main">
    <section id="homeScreen" class="screen active" aria-label="Home">
      <div class="home-shell">
        <div class="pinned-strip" aria-label="Pinned strip placeholder"><strong>Pinned</strong><span>Reserved space</span></div>
        <article class="current-card" aria-label="Current Clip">
          <header class="current-head">
            <div class="current-label">Current Clip</div>
            <div id="autosaveState" aria-live="polite">Saved</div>
          </header>
          <div class="editor">
            <input id="clipTitle" type="text" autocomplete="off" placeholder="Optional title" aria-label="Current clip title">
            <textarea id="clipContent" placeholder="Start typing..." aria-label="Current clip content"></textarea>
          </div>
        </article>
        <div class="home-actions"><button id="newClipBtn" class="primary-btn" type="button">New Clip</button></div>
      </div>
    </section>

    <section id="archiveScreen" class="screen" aria-label="All Clips">
      <div class="archive-shell">
        <header class="archive-head">
          <div><h1>All Clips</h1><p class="muted">Every stored clip. Open or delete.</p></div>
          <button id="archiveNewClipBtn" class="primary-btn" type="button">New Clip</button>
        </header>
        <div id="clipList" class="clip-list"></div>
      </div>
    </section>
  </main>
</div>

<script>
const CLIPS_KEY='trace_clips_sprint_0_5';
const STATE_KEY='trace_state_sprint_0_5';
const THEME_KEY='trace_theme';

let clips=[];
let state={currentClipId:null};
let saveTimer=null;
let activeView='home';

const $=id=>document.getElementById(id);
const nowIso=()=>new Date().toISOString();
const makeId=()=>`clip_${Date.now().toString(36)}_${Math.random().toString(36).slice(2,8)}`;

function createClip(){
  const timestamp=nowIso();
  return {id:makeId(),title:'',content:'',createdAt:timestamp,updatedAt:timestamp};
}

function loadClips(){
  try{
    const parsed=JSON.parse(localStorage.getItem(CLIPS_KEY)||'[]');
    clips=Array.isArray(parsed)?parsed.map(normalizeClip):[];
  }catch{
    clips=[];
  }
}

function normalizeClip(clip){
  const createdAt=clip.createdAt||clip.date||nowIso();
  const updatedAt=clip.updatedAt||clip.date||createdAt;
  return {id:String(clip.id||makeId()),title:clip.title||'',content:clip.content||'',createdAt,updatedAt};
}

function persist(){
  localStorage.setItem(CLIPS_KEY,JSON.stringify(clips));
  localStorage.setItem(STATE_KEY,JSON.stringify(state));
}

function beginFreshSession(){
  const fresh=createClip();
  clips.unshift(fresh);
  state={currentClipId:fresh.id};
  persist();
}

function currentClip(){
  return clips.find(clip=>clip.id===state.currentClipId)||null;
}

function setCurrentClip(id){
  if(!clips.some(clip=>clip.id===id)) return;
  state.currentClipId=id;
  persist();
  renderCurrentClip();
  renderArchive();
}

function newClip(){
  const fresh=createClip();
  clips.unshift(fresh);
  state.currentClipId=fresh.id;
  persist();
  renderCurrentClip();
  renderArchive();
  showView('home');
  $('clipContent').focus();
}

function scheduleAutosave(){
  const clip=currentClip();
  if(!clip) return;
  clip.title=$('clipTitle').value;
  clip.content=$('clipContent').value;
  clip.updatedAt=nowIso();
  $('autosaveState').textContent='Saving...';
  clearTimeout(saveTimer);
  saveTimer=setTimeout(()=>{
    persist();
    renderArchive();
    $('autosaveState').textContent='Saved';
  },180);
}

function renderCurrentClip(){
  const clip=currentClip();
  if(!clip){newClip();return;}
  $('clipTitle').value=clip.title||'';
  $('clipContent').value=clip.content||'';
  $('autosaveState').textContent='Saved';
}

function titleFor(clip){
  const title=(clip.title||'').trim();
  if(title) return title;
  const fromContent=(clip.content||'').trim().split(/\s+/).slice(0,6).join(' ');
  return fromContent||'Untitled clip';
}

function previewFor(clip){
  return (clip.content||'').trim().replace(/\s+/g,' ')||'No content yet';
}

function formatDate(value){
  return new Intl.DateTimeFormat(undefined,{month:'short',day:'numeric',year:'numeric',hour:'numeric',minute:'2-digit'}).format(new Date(value));
}

function renderArchive(){
  $('clipCount').textContent=String(clips.length);
  const list=$('clipList');
  list.innerHTML='';
  const ordered=[...clips].sort((a,b)=>new Date(b.updatedAt)-new Date(a.updatedAt));
  if(!ordered.length){
    list.innerHTML='<div class="empty">No clips stored.</div>';
    return;
  }
  for(const clip of ordered){
    const row=document.createElement('article');
    row.className='clip-row';
    row.innerHTML=`
      <div>
        <div class="clip-title"></div>
        <div class="clip-preview"></div>
        <div class="clip-date"></div>
      </div>
      <div class="row-actions">
        <button class="ghost-btn" type="button" data-action="open">Open</button>
        <button class="danger-btn" type="button" data-action="delete">Delete</button>
      </div>`;
    row.querySelector('.clip-title').textContent=titleFor(clip);
    row.querySelector('.clip-preview').textContent=previewFor(clip);
    row.querySelector('.clip-date').textContent=`Updated ${formatDate(clip.updatedAt)}`;
    row.querySelector('[data-action="open"]').addEventListener('click',()=>{setCurrentClip(clip.id);showView('home');$('clipContent').focus();});
    row.querySelector('[data-action="delete"]').addEventListener('click',()=>deleteClip(clip.id));
    list.appendChild(row);
  }
}

function deleteClip(id){
  const wasCurrent=id===state.currentClipId;
  clips=clips.filter(clip=>clip.id!==id);
  if(wasCurrent){
    const fresh=createClip();
    clips.unshift(fresh);
    state.currentClipId=fresh.id;
    renderCurrentClip();
  }
  persist();
  renderArchive();
}

function showView(view){
  activeView=view;
  $('homeScreen').classList.toggle('active',view==='home');
  $('archiveScreen').classList.toggle('active',view==='archive');
  $('homeNav').classList.toggle('active',view==='home');
  $('archiveNav').classList.toggle('active',view==='archive');
  if(view==='archive') renderArchive();
}

function applyTheme(){
  const stored=localStorage.getItem(THEME_KEY);
  if(stored==='light') document.documentElement.dataset.theme='light';
}

function bindEvents(){
  $('clipTitle').addEventListener('input',scheduleAutosave);
  $('clipContent').addEventListener('input',scheduleAutosave);
  $('newClipBtn').addEventListener('click',newClip);
  $('archiveNewClipBtn').addEventListener('click',newClip);
  $('homeNav').addEventListener('click',()=>showView('home'));
  $('archiveNav').addEventListener('click',()=>showView('archive'));
}

function boot(){
  applyTheme();
  loadClips();
  beginFreshSession();
  bindEvents();
  renderCurrentClip();
  renderArchive();
  $('clipContent').focus();
}

boot();
</script>
</body>
</html>
